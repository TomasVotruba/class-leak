name: Tests

on:
    pull_request: null
    push:
        branches:
            - main

jobs:
    tests:
        strategy:
            fail-fast: false
            matrix:
                php-version: ['7.4', '8.2', '8.5']

        name: PHP ${{ matrix.php-version }}
        runs-on: ubuntu-latest

        steps:
            -   uses: actions/checkout@v5

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-version }}
                    coverage: none

            # analysis tools require PHP 8.2+ and are irrelevant to the test run;
            # drop them so the low-PHP jobs install a clean, 7.4-compatible dependency set
            -   run: composer remove --dev --no-update tracy/tracy symplify/easy-coding-standard phpstan/phpstan symplify/phpstan-extensions phpstan/extension-installer tomasvotruba/unused-public rector/rector rector/jack

            -   run: composer update --no-progress --prefer-stable

            -   name: PHP Linter
                # attribute and intentionally-broken fixtures use syntax newer than 7.4
                run: vendor/bin/parallel-lint src bin tests --exclude tests/ClassNameResolver/Fixture --exclude tests/UseImportsResolver/Fixture/ParseError.php

            -   name: Tests
                run: vendor/bin/phpunit

            -   name: Smoke run CLI app
                run: bin/class-leak check src bin --ansi
