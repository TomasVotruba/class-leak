name: Go

on:
    pull_request: null
    push:
        branches:
            - main

jobs:
    go:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: go

        steps:
            -   uses: actions/checkout@v4

            -
                uses: actions/setup-go@v5
                with:
                    go-version: '1.26'
                    cache-dependency-path: go/go.sum

            -   run: go build ./...

            -   run: go vet ./...

            -
                name: gofmt
                run: test -z "$(gofmt -l .)"

            -   run: go test ./...
